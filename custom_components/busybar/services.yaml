draw_text:
  name: Draw text
  description: Draw printable ASCII text on a BUSY Bar display.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      example: 1234567890abcdef1234567890abcdef
      selector:
        text:
    application_name:
      name: Application name
      description: App namespace used by the BUSY Bar API.
      example: home_assistant
      default: home_assistant
      selector:
        text:
    text:
      name: Text
      description: Printable ASCII text to draw.
      example: Laundry done
      required: true
      selector:
        text:
    display:
      name: Display
      description: Which BUSY Bar display to use.
      default: front
      selector:
        select:
          options:
            - front
            - back
    font:
      name: Font
      default: normal
      selector:
        select:
          options:
            - tiny
            - small
            - normal
            - condensed
            - bold
            - large
            - extra_large
            - global
    color:
      name: Color
      description: RGBA hex color in #RRGGBBAA format.
      default: "#FFFFFFFF"
      selector:
        text:
    led_notification_color:
      name: LED notification color
      description: Optional blinking LED color in #RRGGBBAA format.
      selector:
        text:
    priority:
      name: Priority
      description: Draw priority from 1 to 100.
      default: 80
      selector:
        number:
          min: 1
          max: 100
          mode: box
    duration:
      name: Duration
      description: Time in seconds to display the message. Use 0 for no timeout.
      selector:
        number:
          min: 0
          max: 86400
          mode: box
    clear_before_draw:
      name: Clear before draw
      description: Remove existing display elements for the same application first.
      default: false
      selector:
        boolean:

send_input_command:
  name: Send input command
  description: Send a BUSY Bar input key command to control timer and UI actions.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      selector:
        text:
    key:
      name: Key
      description: BUSY input key to send.
      required: true
      example: start
      selector:
        select:
          options:
            - up
            - down
            - ok
            - back
            - start
            - busy
            - custom
            - off
            - apps
            - settings

draw_dashboard:
  name: Draw dashboard
  description: Send a full BUSY Bar display payload so Home Assistant can render a custom dashboard.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      selector:
        text:
    payload:
      name: Payload
      description: Full BUSY Bar DisplayElements object, including application_name and elements.
      required: true
      example:
        application_name: home_assistant
        priority: 80
        led_notification_color: "#00FF00FF"
        elements:
          - id: title
            type: text
            text: Laundry
            font: bold
            color: "#FFFFFFFF"
            display: front
            align: top_mid
            x: 0
            y: 2
          - id: progress_bg
            type: rectangle
            display: front
            x: 4
            y: 24
            width: 64
            height: 8
            radius: 2
            fill: solid
            fill_colors:
              - "#333333FF"
          - id: progress_fg
            type: rectangle
            display: front
            x: 4
            y: 24
            width: 40
            height: 8
            radius: 2
            fill: solid
            fill_colors:
              - "#00FF00FF"
      selector:
        object:
    clear_before_draw:
      name: Clear before draw
      description: Remove existing display elements for the payload application first.
      default: false
      selector:
        boolean:

draw_entity_dashboard:
  name: Draw entity dashboard
  description: Build a simple BUSY Bar dashboard from current Home Assistant entity values.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      selector:
        text:
    application_name:
      name: Application name
      description: App namespace used by the BUSY Bar API.
      default: home_assistant
      selector:
        text:
    title:
      name: Title
      description: ASCII title shown at the top of the generated dashboard.
      required: true
      example: HOME
      selector:
        text:
    entities:
      name: Entities
      description: List of Home Assistant entities to show. Each item supports entity_id, optional label, and optional attribute.
      required: true
      example:
        - entity_id: sensor.living_room_temperature
          label: TEMP
        - entity_id: weather.home
        - entity_id: sensor.washer_state
          label: WASHER
        - entity_id: sensor.phone_battery
          label: PHONE
      selector:
        object:
    display:
      name: Display
      description: Back display shows up to 4 rows. Front display shows a compact 2-row layout.
      default: back
      selector:
        select:
          options:
            - front
            - back
    color:
      name: Row color
      description: RGBA hex color used for entity rows.
      default: "#FFFFFFFF"
      selector:
        text:
    title_color:
      name: Title color
      description: RGBA hex color used for the dashboard title.
      default: "#FFFFFFFF"
      selector:
        text:
    led_notification_color:
      name: LED notification color
      description: Optional blinking LED color in #RRGGBBAA format.
      selector:
        text:
    priority:
      name: Priority
      description: Draw priority from 1 to 100.
      default: 80
      selector:
        number:
          min: 1
          max: 100
          mode: box
    duration:
      name: Duration
      description: Time in seconds to display the generated dashboard. Use 0 for no timeout.
      selector:
        number:
          min: 0
          max: 86400
          mode: box
    clear_before_draw:
      name: Clear before draw
      description: Remove existing display elements for the same application before drawing the generated dashboard.
      default: true
      selector:
        boolean:

enable_live_entity_dashboard:
  name: Enable live entity dashboard
  description: Keep an entity-based dashboard live by redrawing it automatically when the selected Home Assistant entities change.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      selector:
        text:
    application_name:
      name: Application name
      default: home_assistant
      selector:
        text:
    title:
      name: Title
      required: true
      example: HOME
      selector:
        text:
    entities:
      name: Entities
      description: List of entities that should trigger redraws and appear in the generated dashboard.
      required: true
      selector:
        object:
    display:
      name: Display
      default: back
      selector:
        select:
          options:
            - front
            - back
    color:
      name: Row color
      default: "#FFFFFFFF"
      selector:
        text:
    title_color:
      name: Title color
      default: "#FFFFFFFF"
      selector:
        text:
    led_notification_color:
      name: LED notification color
      selector:
        text:
    priority:
      name: Priority
      default: 80
      selector:
        number:
          min: 1
          max: 100
          mode: box
    duration:
      name: Duration
      description: Optional timeout for each redraw.
      selector:
        number:
          min: 0
          max: 86400
          mode: box
    clear_before_draw:
      name: Clear before draw
      default: true
      selector:
        boolean:

disable_live_dashboard:
  name: Disable live dashboard
  description: Stop automatic redraws for the currently active live dashboard.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      selector:
        text:

