bind_button_action:
  name: Bind button action
  description: Bind a BUSY Bar hardware button event to a Home Assistant service call for the current runtime.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      selector:
        text:
    button:
      name: Button
      description: BUSY Bar button name from the websocket event, for example START.
      required: true
      example: START
      selector:
        text:
    action:
      name: Action
      description: Button action type, usually PRESS.
      default: PRESS
      selector:
        text:
    service:
      name: Service
      description: Home Assistant service in domain.service format.
      required: true
      example: light.toggle
      selector:
        text:
    service_data:
      name: Service data
      description: Optional service data passed to the Home Assistant service.
      selector:
        object:

clear_button_actions:
  name: Clear button actions
  description: Remove runtime button-action bindings for a BUSY Bar entry.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      selector:
        text:
    button:
      name: Button
      description: Optional button name filter.
      selector:
        text:
    action:
      name: Action
      description: Optional action filter.
      selector:
        text:

clear_display:
  name: Clear display
  description: Clear BUSY Bar display elements.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      selector:
        text:
    application_name:
      name: Application name
      description: When set, clears only that application namespace.
      selector:
        text:

set_brightness:
  name: Set brightness
  description: Set BUSY Bar display brightness.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      selector:
        text:
    value:
      name: Value
      description: Brightness value from 0 to 100. Use the Brightness Mode select entity to switch between auto and manual.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider

set_volume:
  name: Set volume
  description: Set BUSY Bar audio volume in 5% increments.
  fields:
    entry_id:
      name: Entry ID
      description: Required only when more than one BUSY Bar is configured.
      selector:
        text:
    volume:
      name: Volume
      description: Value from 0 to 100 in steps of 5.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 5
          mode: slider
    silent:
      name: Silent
      description: Do not play the device volume-change sound.
      default: true
      selector:
        boolean: